name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose assets are published
        required: true
        default: v0.1.1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
